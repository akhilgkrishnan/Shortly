services:
  - type: web
    name: shortly
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shortly-db
          property: connectionString

databases:
  - name: shortly-db
    plan: free
    region: oregon
    databaseName: shortly_production
    user: shortly
